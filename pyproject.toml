[project]
name = "quantum-eeg-classifier"
version = "1.0.0"
description = "Hybrid Quantum-Classical EEG Signal Classifier for Seizure Detection"
requires-python = ">=3.11"
readme = "README.md"

[project.dependencies]
# Quantum
qiskit = ">=2.0"
qiskit-machine-learning = ">=0.9.0"

# Signal Processing
mne = ">=1.6"
numpy = ">=1.26"
scipy = ">=1.12"
PyWavelets = ">=1.5"

# ML
scikit-learn = ">=1.4"

# Data
pandas = ">=2.1"

# UI
streamlit = ">=1.35"

# Visualization
plotly = ">=5.18"
matplotlib = ">=3.8"

# Reports
reportlab = ">=4.0"

# Configuration
pyyaml = ">=6.0"

# Serialization
joblib = ">=1.3"
dill = ">=0.3.8"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
